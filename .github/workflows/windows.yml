name: Windows preview

on:
  workflow_dispatch:
  push:
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test and package
        shell: pwsh
        run: ./windows/build.ps1 -Runtime '${{ matrix.runtime }}'
      - name: Upload preview and validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Xclip-Windows-preview-${{ matrix.runtime }}
          path: |
            windows/artifacts/*.zip
            windows/artifacts/*.sha256
            windows/artifacts/smoke-*/
          if-no-files-found: error
